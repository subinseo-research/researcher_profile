<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Publications - Subin Seo</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&family=Montserrat:wght@300&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
	<link href="css/style.css?v=67" rel="stylesheet">
	<script src="js/nav.js?v=14"></script>
	<link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml">
</head>
<body>

	<div class="page">
		<h1>Publications</h1>
		<nav class="tag-filter" id="tag-filter" aria-label="Filter by area"></nav>
		<div id="all-publications"></div>
	</div>

	<footer>
		&copy; 2026 Subin Seo
	</footer>

	<script src="data/publications.js?v=12"></script>
	<script src="js/publications.js?v=11"></script>
	<script>
		var tag = new URLSearchParams(location.search).get("tag");
		if (!window.TAGS[tag]) tag = null;
		renderTagFilter(document.getElementById("tag-filter"), tag);
		renderPublications(document.getElementById("all-publications"), { groupByYear: true, tag: tag });
	</script>
</body>
</html>
